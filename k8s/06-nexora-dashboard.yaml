apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-dashboard
  namespace: nexora
  labels:
    app.kubernetes.io/name: nexora-dashboard
    app.kubernetes.io/part-of: nexora-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexora-dashboard
  template:
    metadata:
      labels:
        app: nexora-dashboard
    spec:
      containers:
        - name: nexora-dashboard
          image: slimbouzidi/nexora-dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: nexora-config
                  key: NODE_ENV
            - name: PORT
              value: "3001"
            - name: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: nexora-secret
                  key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
            - name: CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: nexora-secret
                  key: CLERK_SECRET_KEY
            - name: NEXT_PUBLIC_CLERK_SIGN_IN_URL
              valueFrom:
                configMapKeyRef:
                  name: nexora-config
                  key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
            - name: NEXT_PUBLIC_CLERK_SIGN_UP_URL
              valueFrom:
                configMapKeyRef:
                  name: nexora-config
                  key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
            - name: NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL
              valueFrom:
                configMapKeyRef:
                  name: nexora-config
                  key: NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL
            - name: NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL
              valueFrom:
                configMapKeyRef:
                  name: nexora-config
                  key: NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL
            - name: NEXT_PUBLIC_CLERK_SIGN_IN_FORCE_REDIRECT_URL
              valueFrom:
                configMapKeyRef:
                  name: nexora-config
                  key: NEXT_PUBLIC_CLERK_SIGN_IN_FORCE_REDIRECT_URL
            - name: NEXT_PUBLIC_CLERK_SIGN_UP_FORCE_REDIRECT_URL
              valueFrom:
                configMapKeyRef:
                  name: nexora-config
                  key: NEXT_PUBLIC_CLERK_SIGN_UP_FORCE_REDIRECT_URL
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: nexora-dashboard-service
  namespace: nexora
  labels:
    app.kubernetes.io/name: nexora-dashboard-service
    app.kubernetes.io/part-of: nexora-stack
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
      name: http
  selector:
    app: nexora-dashboard
