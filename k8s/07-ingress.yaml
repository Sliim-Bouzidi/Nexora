apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexora-ingress
  namespace: nexora
  labels:
    app.kubernetes.io/name: nexora-ingress
    app.kubernetes.io/part-of: nexora-stack
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Dashboard Application Routes
          - path: /dashboard
            pathType: Prefix
            backend:
              service:
                name: nexora-dashboard-service
                port:
                  number: 3001
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: nexora-dashboard-service
                port:
                  number: 3001
          # Articles API (Lives in Main Nexora app connected to Postgres)
          - path: /api/articles
            pathType: Prefix
            backend:
              service:
                name: nexora-landing-service
                port:
                  number: 3000

          # Dashboard API routes
          - path: /api/products
            pathType: Prefix
            backend:
              service:
                name: nexora-dashboard-service
                port:
                  number: 3001
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: nexora-dashboard-service
                port:
                  number: 3001

          # Landing Application (Catch-all)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexora-landing-service
                port:
                  number: 3000
