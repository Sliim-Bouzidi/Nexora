apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-landing
  namespace: nexora
  labels:
    app.kubernetes.io/name: nexora-landing
    app.kubernetes.io/part-of: nexora-stack
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nexora-landing
  template:
    metadata:
      labels:
        app: nexora-landing
    spec:
      containers:
        - name: nexora-landing
          image: slimbouzidi/nexora:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: nexora-config
                  key: NODE_ENV
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nexora-secret
                  key: DATABASE_URL
            - name: CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: nexora-secret
                  key: CLERK_SECRET_KEY
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: nexora-landing-service
  namespace: nexora
  labels:
    app.kubernetes.io/name: nexora-landing-service
    app.kubernetes.io/part-of: nexora-stack
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: nexora-landing
