services:
  nexora:
    image: ${DOCKERHUB_USERNAME:-slimbouzidi}/nexora:latest
    container_name: nexora
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL:-postgresql://nexora:nexorapassword@postgres:5432/nexora_cms}
    volumes:
      - articles_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nexora-dashboard:
    image: ${DOCKERHUB_USERNAME:-slimbouzidi}/nexora-dashboard:latest
    container_name: nexora-dashboard
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: "/auth/sign-in"
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: "/auth/sign-up"
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: "/dashboard/overview"
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: "/dashboard/overview"
      NEXT_PUBLIC_CLERK_SIGN_IN_FORCE_REDIRECT_URL: "/dashboard/overview"
      NEXT_PUBLIC_CLERK_SIGN_UP_FORCE_REDIRECT_URL: "/dashboard/overview"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: nexora-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nexora
      - nexora-dashboard
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: nexora-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexorapassword
      POSTGRES_DB: nexora_cms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora_cms"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  articles_data:
