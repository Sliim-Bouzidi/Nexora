services:
  nexora:
    build: .
    image: nexora:1.0
    container_name: nexora
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: nexora-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nexora
    restart: unless-stopped
