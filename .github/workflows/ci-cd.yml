# CI validates each push. CD deploys only successful pushes to main.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs on a temporary GitHub-hosted runner.
  verify:
    name: Verify application build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  # Build Docker image on GitHub Actions & push to Docker Hub
  docker:
    name: Build and push Docker image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nexora:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nexora:${{ github.sha }}

  # CD: runs only after CI succeeds for a push to main.
  deploy:
    name: Deploy to Ubuntu test VM
    needs: [verify, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # This makes GitHub assign the job to your Ubuntu VM's runner service.
    runs-on: self-hosted
    steps:
      # Downloads the exact pushed commit into the runner's work folder on the VM.
      - name: Check out source code
        uses: actions/checkout@v4

      # Pull pre-built images directly from Docker Hub
      - name: Pull latest Docker images
        run: docker compose -p nexora pull

      # Deploy using pre-built images (no rebuild required on VM)
      - name: Deploy with Docker Compose
        run: docker compose -p nexora up -d --remove-orphans

      # The deployment is successful only when Nginx responds on the VM's HTTP port.
      - name: Verify deployed application
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent --show-error http://localhost > /dev/null; then
              echo "Deployment health check passed."
              exit 0
            fi
            sleep 3
          done
          docker compose -p nexora ps
          docker compose -p nexora logs
          exit 1
