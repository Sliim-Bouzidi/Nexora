# CI validates each push. CD deploys only successful pushes to main.
name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs on a temporary GitHub-hosted runner.
  verify:
    name: Verify application build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  # Build Docker images on GitHub Actions & push to Docker Hub (Parallel)
  docker:
    name: Build & push ${{ matrix.name }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: Nexora Main App
            context: .
            image: nexora
          - name: CMS Dashboard
            context: ./dashboard
            image: nexora-dashboard
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

  # CD: runs only after CI succeeds for a push to main.
  deploy:
    name: Deploy to Ubuntu test VM
    needs: [verify, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pin both images to this commit's SHA in the manifests, then apply once.
      # (Applying ":latest" and then running "kubectl set image" caused two rollouts per deploy.)
      - name: Apply Kubernetes manifests with new image tags
        run: |
          sed -i "s/newTag: latest/newTag: ${{ github.sha }}/" k8s/kustomization.yaml
          kubectl apply --validate=false -k k8s/

      # Fails the job if the new pods don't become ready (e.g. crash loop, bad image tag),
      # instead of letting the old pods answer the health check below.
      - name: Wait for rollout to finish
        run: |
          kubectl rollout status deployment/nexora-landing -n nexora --timeout=300s
          kubectl rollout status deployment/nexora-dashboard -n nexora --timeout=300s

      - name: Verify application is responding
        run: |
          curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://localhost


