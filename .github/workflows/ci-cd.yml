# CI validates each push. CD deploys only successful pushes to main.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs on a temporary GitHub-hosted runner.
  verify:
    name: Verify application build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  # Build Docker images on GitHub Actions & push to Docker Hub
  docker:
    name: Build and push Docker images
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Nexora Main App image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nexora:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nexora:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push CMS Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nexora-dashboard:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nexora-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # CD: runs only after CI succeeds for a push to main.
  deploy:
    name: Deploy to Ubuntu test VM
    needs: [verify, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Clean up unused container images and evicted pods
        run: |
          sudo crictl rmi --prune || true
          docker system prune -af || true
          kubectl delete pods --field-selector=status.phase=Failed -n nexora || true

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -k k8s/

      - name: Update Kubernetes deployments with new image tags
        run: |
          kubectl set image deployment/nexora-landing nexora-landing=${{ secrets.DOCKERHUB_USERNAME }}/nexora:${{ github.sha }} -n nexora
          kubectl set image deployment/nexora-dashboard nexora-dashboard=${{ secrets.DOCKERHUB_USERNAME }}/nexora-dashboard:${{ github.sha }} -n nexora

      - name: Wait for zero-downtime rolling update
        run: |
          kubectl rollout status deployment/nexora-landing -n nexora --timeout=300s || (kubectl get pods -n nexora && kubectl describe pods -l app=nexora-landing -n nexora && exit 1)
          kubectl rollout status deployment/nexora-dashboard -n nexora --timeout=300s || (kubectl get pods -n nexora && kubectl describe pods -l app=nexora-dashboard -n nexora && exit 1)


      - name: Verify deployed application health
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent --show-error http://localhost > /dev/null; then
              echo "Kubernetes deployment health check passed."
              exit 0
            fi
            echo "Attempt $attempt: Waiting for ingress endpoint to respond..."
            sleep 3
          done
          kubectl get pods,svc,ingress -n nexora
          kubectl logs -l app=nexora-landing -n nexora --tail=50
          kubectl logs -l app=nexora-dashboard -n nexora --tail=50
          exit 1

