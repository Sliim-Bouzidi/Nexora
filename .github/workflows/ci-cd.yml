# CI validates each push. CD deploys only successful pushes to main.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs on a temporary GitHub-hosted runner.
  verify:
    name: Verify application build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  # Build Docker images on GitHub Actions & push to Docker Hub (Parallel)
  docker:
    name: Build & push ${{ matrix.name }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: Nexora Main App
            context: .
            image: nexora
          - name: CMS Dashboard
            context: ./dashboard
            image: nexora-dashboard
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

  # CD: runs only after CI succeeds for a push to main.
  deploy:
    name: Deploy to Ubuntu test VM
    needs: [verify, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply --validate=false -k k8s/

      - name: Update Kubernetes deployments with new image tags
        run: |
          kubectl set image deployment/nexora-landing nexora-landing=${{ secrets.DOCKERHUB_USERNAME }}/nexora:${{ github.sha }} -n nexora
          kubectl set image deployment/nexora-dashboard nexora-dashboard=${{ secrets.DOCKERHUB_USERNAME }}/nexora-dashboard:${{ github.sha }} -n nexora

      - name: Verify application is responding
        run: |
          sleep 10
          curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://localhost


